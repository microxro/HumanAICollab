<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="StudyHold — a complete school tracker for classes, homework, grades, schedule, extracurriculars, and study tools. Built with plain HTML, CSS, and JavaScript." />
<meta name="color-scheme" content="light dark" />
<title>StudyHold — School Tracker</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text y='72' x='50' font-size='62' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>S</text></svg>" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0c0f17" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="StudyHold" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />

<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/views.css" />
</head>
<body>

<div class="shell">

  <!-- ------------------------------------------------------- sidebar -- -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="logo">S</span>
      <span class="logo-text">Study<span>Hold</span></span>
    </div>

    <nav class="sidebar-scroll" id="navScroll" aria-label="Main navigation">
      <!-- rendered by app.js -->
    </nav>

    <div class="sidebar-foot">
      <button class="profile-chip" id="profileChip" aria-label="Open settings"></button>
      <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" data-tip="Collapse sidebar" aria-label="Toggle sidebar width">
        <span class="ico" id="collapseIco">⇤</span><span class="lbl">Collapse</span>
      </button>
    </div>
  </aside>

  <!-- ---------------------------------------------------------- main -- -->
  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Open navigation">☰</button>

      <button class="searchbar" id="searchBtn" aria-label="Open command palette">
        <span aria-hidden="true">⌕</span>
        <span class="label">Search or jump to…</span>
        <kbd>⌘K</kbd>
      </button>

      <div class="today-strip" id="todayStrip" aria-live="off"></div>

      <div class="topbar-right">
        <button class="icon-btn" id="syncBtn" data-tip="Sync status" aria-label="Sync status">○</button>
        <span id="syncStatusText" class="sr-only" role="status" aria-live="polite"></span>
        <button class="icon-btn" id="notifBtn" data-tip="Recent notifications" aria-label="Recent notifications">🔔</button>
        <button class="icon-btn" id="addBtn" data-tip="New assignment" aria-label="New assignment">+</button>
        <button class="icon-btn" id="themeBtn" data-tip="Toggle theme" aria-label="Toggle dark mode">☾</button>
      </div>
    </header>

    <div class="ptr-indicator" id="ptrIndicator" aria-hidden="true"><span class="ptr-spin">↻</span></div>

    <main class="page" id="page">
      <span class="sr-only">Loading StudyHold…</span>
      <div class="page-inner" aria-hidden="true">
        <div class="skel" style="height:120px;border-radius:var(--radius-lg);margin-bottom:16px"></div>
        <div class="grid g-3">
          <div class="card"><div class="card-body">
            <div class="skel skel-line" style="width:55%;height:15px;margin-bottom:10px"></div>
            <div class="skel skel-line skel-line-sm" style="width:35%"></div>
          </div></div>
          <div class="card"><div class="card-body">
            <div class="skel skel-line" style="width:55%;height:15px;margin-bottom:10px"></div>
            <div class="skel skel-line skel-line-sm" style="width:35%"></div>
          </div></div>
          <div class="card"><div class="card-body">
            <div class="skel skel-line" style="width:55%;height:15px;margin-bottom:10px"></div>
            <div class="skel skel-line skel-line-sm" style="width:35%"></div>
          </div></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- U46 — colour-vision-deficiency simulation filters, referenced by [data-cvd] in theme.css -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="cvd-protanopia"><feColorMatrix type="matrix" values="
      0.567 0.433 0     0 0
      0.558 0.442 0     0 0
      0     0.242 0.758 0 0
      0     0     0     1 0" /></filter>
    <filter id="cvd-deuteranopia"><feColorMatrix type="matrix" values="
      0.625 0.375 0   0 0
      0.7   0.3   0   0 0
      0     0.3   0.7 0 0
      0     0     0   1 0" /></filter>
    <filter id="cvd-tritanopia"><feColorMatrix type="matrix" values="
      0.95 0.05  0     0 0
      0    0.433 0.567 0 0
      0    0.475 0.525 0 0
      0    0     0     1 0" /></filter>
  </defs>
</svg>

<nav class="mobile-tabbar" id="mobileTabbar" aria-label="Primary"></nav>
<button class="fab-add" id="fabAdd" aria-label="New assignment" data-tip="New assignment">+</button>

<div class="scrim" id="scrim"></div>
<div class="toast-host" id="toastHost" role="status" aria-live="polite" aria-atomic="false"></div>

<noscript>
  <p style="padding:40px;text-align:center">
    StudyHold needs JavaScript enabled — everything runs in your browser, with no server.
  </p>
</noscript>

<!-- core -->
<script src="js/utils.js"></script>
<script src="js/store.js"></script>
<script src="js/store2.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>

<!-- libraries -->
<script src="js/md.js"></script>
<script src="js/nlp.js"></script>
<script src="js/ics.js"></script>
<script src="js/idb.js"></script>
<script src="js/notify.js"></script>
<script src="js/geo.js"></script>
<script src="js/sync.js"></script>
<script src="js/assistant.js"></script>
<script src="js/aiadd.js"></script>
<script src="js/planner.js"></script>
<script src="js/guidance.js"></script>

<!-- views -->
<script src="js/views/assistant.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/calendar.js"></script>
<script src="js/views/schedule.js"></script>
<script src="js/views/planner.js"></script>
<script src="js/views/homework.js"></script>
<script src="js/views/classes.js"></script>
<script src="js/views/grades.js"></script>
<script src="js/views/focus.js"></script>
<script src="js/views/flashcards.js"></script>
<script src="js/views/notes.js"></script>
<script src="js/views/reading.js"></script>
<script src="js/views/activities.js"></script>
<script src="js/views/goals.js"></script>
<script src="js/views/college.js"></script>
<script src="js/views/guidance.js"></script>
<script src="js/views/contacts.js"></script>
<script src="js/views/analytics.js"></script>
<script src="js/views/sharing.js"></script>
<script src="js/views/groups.js"></script>
<script src="js/views/parent.js"></script>
<script src="js/views/settings.js"></script>

<!-- boot -->
<script src="js/app.js"></script>
</body>
</html>
