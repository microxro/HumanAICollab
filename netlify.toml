[build]
  publish = "."
  command = "echo 'Static site — no build step.'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The API function declares its own path (/api/*) via `export const config`,
# so no redirects are needed for it.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # DENY, not SAMEORIGIN. The app contains no iframe and is never framed by
    # anything, so allowing same-origin framing buys nothing and leaves a
    # clickjacking path open through any same-origin HTML an attacker manages
    # to get hosted. frame-ancestors 'none' below is the modern equivalent;
    # both are sent because older browsers only honour the header.
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    # Content-Security-Policy
    #
    # script-src has no 'unsafe-inline': every <script> in index.html uses
    # src=, and the three former inline onclick handlers are now delegated
    # listeners, so nothing needs it. That is the half of a CSP that actually
    # stops injected script from running.
    #
    # style-src does allow 'unsafe-inline', because the views set colours via
    # style="" attributes throughout (class colours, chart fills, progress
    # widths). Removing that is a real refactor, not a header change, and
    # inline *style* is a far smaller exposure than inline script.
    #
    # img-src allows data: and blob: for camera captures, IndexedDB-backed
    # class covers and generated exports. connect-src is same-origin only —
    # the Gemini and Resend calls happen server-side in Netlify Functions, so
    # the browser never talks to a provider directly.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Revalidate every load rather than trusting a timer.
#
# These filenames are not content-hashed — js/views/guidance.js is the same
# URL in every deploy — so any max-age above zero serves stale code for that
# long after a release. It did: an hour-old guidance.js paired with a
# just-deployed function, giving an app that showed the new error text inside
# the old UI. The service worker's network-first fetch does not save you,
# because that fetch is answered by the browser's own HTTP cache and never
# reaches the CDN.
#
# max-age=0 + must-revalidate is not "no caching": the copy is kept and an
# ETag revalidation returns 304 with no body. The cost is one conditional
# request per file per load; the alternative is shipping a release that some
# fraction of users cannot receive for an hour.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
